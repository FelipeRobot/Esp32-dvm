; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; Todas las versiones estan fijadas para reproducibilidad (ver README).
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino

; C++17 para el firmware de aplicacion
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; Version fijada (~1.3.0 = >=1.3.0,<1.4.0): la 1.3.0 renombro los enums con
; prefijo INA226_ y depreco setCurrentRange() en favor de setResistorRange()
lib_deps = wollewald/INA226_WE@~1.3.0

monitor_speed = 115200
