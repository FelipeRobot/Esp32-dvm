; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; C++17 para el firmware de aplicacion
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; INA226_WE >= 1.3.0 (enums con prefijo INA226_, setResistorRange disponible)
lib_deps = wollewald/INA226_WE@^1.3.0

monitor_speed = 115200
