; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; C++17 para el firmware de aplicacion
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

; INA219_WE >= 1.4.1 (setShuntSizeInOhms, getCurrent_mA, getOverflow, getConversionReady)
lib_deps = wollewald/INA219_WE@^1.4.1

monitor_speed = 115200
